name: CI

# Compile gate for the transport: the wire protocol, the socket worker and the wire
# dump, on every platform plugin.cfg declares. It exists because the Windows branch
# of SocketWorker shipped without ever being compiled anywhere, and nothing in this
# repo could have caught that.
#
# The transport job skips the plugin: SCORBIT_TRANSPORT_ONLY avoids the VPX header
# fetch, so it needs no network and stays under a minute. windows-plugin builds the
# whole plugin on MSVC and uploads the staged folder.
#
# No secrets are used, and none may be added. The plugin carries no credentials
# (SB-5991), windows-plugin uploads it as an artifact, and artifacts on a public repo
# are readable by anyone signed in. Fork pull requests must never reach a secret either.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  transport:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports. One red leg should not hide the state of the others,
      # which is the whole point of a matrix on a repo with no other gate.
      fail-fast: false
      matrix:
        include:
          # Runner choices follow vpinball/pinmame's libpinmame.yml, the closest
          # analogue in the programme. Its matrix covers twelve targets including
          # Android, iOS and tvOS; this one covers the six in plugin.cfg.
          #
          # pinmame uses windows-2025-vs2026 to match the toolchain VPX itself is
          # built with. windows-2025 is used here because it is a standard label with
          # no availability question; switch if the VS version ever matters.
          - { os: windows-2025,     platform: windows, arch: x64,     test: true }
          # 32-bit runs natively on the x64 runner (WOW64), so the wire vectors are
          # checked from a 32-bit build talking to a 64-bit daemon's encoding (SB-6069).
          - { os: windows-2025,     platform: windows, arch: x86,     test: true,
              cmake_extra: "-A Win32" }
          - { os: ubuntu-24.04,     platform: linux,   arch: x64,     test: true }
          # Native arm64, not cross-compiled, so the tests actually run on the target.
          - { os: ubuntu-24.04-arm, platform: linux,   arch: aarch64, test: true }
          - { os: macos-15,         platform: macos,   arch: arm64,   test: true }
          # macos-15 is arm64, so the x64 leg cross-compiles and cannot run what it
          # builds. Compile-only, and honest about it rather than relying on Rosetta
          # being present.
          - { os: macos-15,         platform: macos,   arch: x64,     test: false,
              cmake_extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSCORBIT_TRANSPORT_ONLY=ON
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # socket_worker_test is guarded behind NOT WIN32 in test/CMakeLists.txt, because
      # TestPeer speaks POSIX sockets directly. On Windows this runs wire_codec alone,
      # which is still the first time that codec has met MSVC.
      - name: Test
        if: matrix.test
        run: ctest --test-dir build --build-config Release --no-tests=error --output-on-failure

  # The full plugin on MSVC. Since SB-5991 it has no dependencies beyond the VPX
  # headers fetched at configure time, so no package manager is involved. Kept apart
  # from the transport gate, whose speed is the point of it.
  windows-plugin:
    name: windows-${{ matrix.arch }}-plugin
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, vs_arch: x64 }
          - { arch: x86, vs_arch: Win32 }

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Visual Studio generator, which finds MSVC unaided; Ninja would need a vcvars
      # step first.
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.vs_arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --no-tests=error --output-on-failure

      # Checked by name before upload, so a build that stages the wrong thing fails
      # here rather than in someone's VPX install. plugin.cfg is what VPX reads to
      # find the DLL, so the name has to match it.
      - name: Verify the staged plugin
        shell: pwsh
        run: |
          $stage = "build/stage/scorbit"
          $key = "windows.${{ matrix.arch }}"
          $dll = (Select-String -Path plugin.cfg -Pattern ('^' + [regex]::Escape($key) + '\s*=\s*"(.+)"')).Matches.Groups[1].Value
          if (-not $dll) { throw "plugin.cfg declares no $key library" }
          foreach ($f in @($dll, "plugin.cfg")) {
            if (-not (Test-Path (Join-Path $stage $f))) { throw "staged folder is missing $f" }
          }
          # VPX picks the key by its own pointer width, so the DLL has to match the key.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $stage $dll))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $want = @{ x64 = 0x8664; x86 = 0x14c }["${{ matrix.arch }}"]
          if ($machine -ne $want) { throw ("{0} is machine 0x{1:x}, expected 0x{2:x}" -f $dll, $machine, $want) }
          # The plugin carries no SDK and no credentials since SB-5991.
          if (Get-ChildItem $stage -Recurse -Filter "*scorbit_sdk*") { throw "a scorbit_sdk library was staged" }
          Get-ChildItem $stage -Recurse -File | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1) }

      - name: Upload the staged plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-scorbit-windows-${{ matrix.arch }}
          path: build/stage/scorbit
          if-no-files-found: error
          retention-days: 14

  # The full plugin on Linux, which is the only build of the X11 status light. The xcb
  # headers are a build dependency only: the libraries are loaded at run time.
  linux-plugin:
    name: linux-${{ matrix.arch }}-plugin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     arch: x64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the xcb headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxcb1-dev libxcb-shape0-dev libxcb-randr0-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --no-tests=error --output-on-failure

      - name: Verify the staged plugin
        run: |
          so="build/stage/scorbit/$(sed -n 's/^linux\.${{ matrix.arch }} = "\(.*\)"$/\1/p' plugin.cfg)"
          test -f "$so" || { echo "plugin.cfg's linux.${{ matrix.arch }} library was not staged"; exit 1; }
          readelf -d "$so" | grep NEEDED
          # Loaded with dlopen, so a machine without X can still load the plugin.
          if readelf -d "$so" | grep -q 'NEEDED.*libxcb'; then echo "$so links libxcb"; exit 1; fi
          # ...and the light is built in: it names the library it loads.
          grep -q 'libxcb-shape.so.0' "$so" || { echo "$so has no X11 status light"; exit 1; }
